name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The suite uses a stub encoder, so it needs neither the embedding model
      # nor torch. Keeping CI to these two packages is what makes it fast.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pytest

      - name: Run tests
        run: python -m pytest tests -q

  guard:
    name: no biometric data committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A voiceprint or a clip of a real person must never reach this repo.
      # A follow-up commit cannot undo it, so fail the build instead.
      - name: Scan tracked files
        run: |
          matches=$(git ls-files | grep -Ei '\.(wav|mp3|flac|m4a|ogg|eagle)$|(^|/)registry\.json$|(^|/)profiles\.json$' || true)
          if [ -n "$matches" ]; then
            echo "::error::Biometric or audio data is tracked in this repository:"
            echo "$matches"
            exit 1
          fi
          echo "Clean — no audio, voiceprints, or registries tracked."
